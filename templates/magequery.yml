spec:
  inputs:
    version:
      default: latest
      description: magequery version to install (for example, "0.9.0"), or "latest".
    args:
      default: doctor
      description: Any magequery command and its arguments.
    root:
      default: '.'
      description: Magento project root, relative to the workspace.
    sync:
      type: boolean
      default: true
      description: >-
        Install bougie and run `bougie sync` first, so magequery sees a
        populated vendor/ tree. Disable when a previous job already provides
        vendor/ via cache or artifacts.
    cache-key:
      default: bougie
      description: >-
        GitLab cache key for the bougie tree. Matches the bougie component's
        default, so this job shares its cache.
    stage:
      default: test
      description: Pipeline stage the check runs in.
    image:
      default: buildpack-deps:curl
      description: Job image; needs curl, tar, and a glibc or musl userland.
    codequality:
      type: boolean
      default: true
      description: >-
        When args run doctor, also write its findings as a Code Quality
        report and upload it, so the merge request shows them. Needs a
        magequery with `doctor --format gitlab`; older ones skip it.
    codequality-file:
      default: gl-code-quality-report.json
      description: Where the Code Quality report is written, relative to the project directory.
---
# Install magequery and run a static check or query against a Magento 2 /
# Mage-OS project. magequery reads the source tree directly, so static
# commands need no database, generated code, or Magento bootstrap — but most
# checks want vendor/ present, so by default the job installs bougie and runs
# `bougie sync` first (with the same in-project cache layout as the bougie
# component).
magequery:
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  variables:
    BOUGIE_HOME: $CI_PROJECT_DIR/.bougie
    BOUGIE_CACHE: $CI_PROJECT_DIR/.bougie/cache
    BOUGIE_NO_SELF_UPDATE: '1'
  # Same stable mutable key as the bougie component (see its template for
  # why this isn't keyed on composer.lock), so the two share one cache.
  cache:
    key: $[[ inputs.cache-key ]]
    paths:
      - .bougie/
  # Uploaded when doctor fails too: that is when the merge request needs it.
  artifacts:
    when: always
    reports:
      codequality: $[[ inputs.codequality-file ]]
  script:
    - |
      set -eu
      export PATH="$HOME/.local/bin:$PATH"
      if [ '$[[ inputs.sync ]]' = true ]; then
        curl --proto '=https' --tlsv1.2 -fLsS -o /tmp/bougie-installer.sh \
          "https://github.com/cresset-tools/bougie/releases/latest/download/bougie-installer.sh"
        sh /tmp/bougie-installer.sh
        (cd '$[[ inputs.root ]]' && bougie sync)
      fi
      version='$[[ inputs.version ]]'
      if [ "$version" = latest ]; then
        installer="https://github.com/cresset-tools/magequery/releases/latest/download/magequery-installer.sh"
      else
        installer="https://github.com/cresset-tools/magequery/releases/download/magequery-v${version}/magequery-installer.sh"
      fi
      curl --proto '=https' --tlsv1.2 -fLsS -o /tmp/magequery-installer.sh "$installer"
      sh /tmp/magequery-installer.sh
      report="$CI_PROJECT_DIR/$[[ inputs.codequality-file ]]"
      # An empty report when there is nothing to report on, so the upload
      # never warns about a missing file.
      echo '[]' > "$report"
      status=0
      (cd '$[[ inputs.root ]]' && magequery $[[ inputs.args ]]) || status=$?
      set -f
      set -- $[[ inputs.args ]]
      set +f
      if [ '$[[ inputs.codequality ]]' = true ] && [ "${1:-}" = doctor ]; then
        if magequery doctor --help 2>/dev/null | grep -q -- 'gitlab'; then
          # From the project directory, so paths in the report are the
          # repository's even when the store sits in a subdirectory. Kept
          # only when it is a report (args that pick another format conflict).
          magequery --root '$[[ inputs.root ]]' $[[ inputs.args ]] --format gitlab > "$report.new" 2>/dev/null || true
          if [ "$(head -c1 "$report.new")" = '[' ]; then mv "$report.new" "$report"; else rm -f "$report.new"; fi
        else
          echo "magequery $(magequery --version) has no doctor --format gitlab; no Code Quality report"
        fi
      fi
      exit "$status"
